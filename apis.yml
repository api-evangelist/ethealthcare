name: ethealthcare
description: ET Healthcare (ethealthcare.com.cn) is an in-vitro diagnostics (IVD) company founded in
  2008 and headquartered in Palo Alto, California, with operations in China. It develops immunodiagnostic
  systems built on its proprietary "lab-on-a-tip" technology, delivering central-lab-grade immunoassay
  performance in a near-patient setting. Its flagship Pylon platform (Pylon 3D automated immunoassay
  analyzers plus single-use Pylon Test Strips) runs cardiac, inflammation, fertility, infectious-disease,
  and tumor assays on whole blood, plasma, and serum. Backed by Qiming Venture Partners and other
  investors, ET Healthcare is a medical-device / clinical-laboratory instrument maker and does not
  currently publish a public developer API surface.
